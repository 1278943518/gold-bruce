name: 黄金看盘每日刷新

on:
  schedule:
    # 北京时间 08:00 / 12:00 / 16:00 / 20:00 / 次日 04:00
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: gold-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 跑数据管道并重建页面
        run: python scripts/daily_refresh_ci.py

      - name: 有变化则提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: 每日刷新 $(date -u +%Y-%m-%d)"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
